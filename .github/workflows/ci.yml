name: CI — Validate Spellbook

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-skills:
    name: Validate Skill Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check skill frontmatter and structure
        run: |
          ERRORS=0
          for skill in skills/*/skill.md; do
            echo "--- Checking: $skill ---"
            SKILL_ERRORS=0

            # Check frontmatter opening
            head -1 "$skill" | grep -q "^---" || { echo "  FAIL: Missing frontmatter (first line must be ---)"; SKILL_ERRORS=1; }

            # Check required frontmatter fields
            grep -q "^name:" "$skill" || { echo "  FAIL: Missing name: in frontmatter"; SKILL_ERRORS=1; }
            grep -q "^description:" "$skill" || { echo "  FAIL: Missing description: in frontmatter"; SKILL_ERRORS=1; }

            # Check required sections
            grep -q "## When to Activate" "$skill" || { echo "  FAIL: Missing '## When to Activate' section"; SKILL_ERRORS=1; }
            grep -q "## Checklist" "$skill" || { echo "  FAIL: Missing '## Checklist' section"; SKILL_ERRORS=1; }
            grep -q "\- \[ \]" "$skill" || { echo "  FAIL: Checklist has no '- [ ]' items"; SKILL_ERRORS=1; }

            if [ $SKILL_ERRORS -eq 0 ]; then
              echo "  PASS"
            else
              ERRORS=$((ERRORS + SKILL_ERRORS))
            fi
          done

          echo ""
          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS format errors found"
            exit 1
          else
            echo "✅ All skills passed format validation"
          fi

  lint-markdown:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install markdownlint
        run: npm install -g markdownlint-cli2

      - name: Lint markdown files
        run: |
          markdownlint-cli2 "**/*.md" "#node_modules" "#.github" "#.venv"

  validate-tools:
    name: Validate Tool Configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check install.sh is executable and parses
        run: |
          bash -n tools/install.sh
          echo "✅ install.sh syntax OK"

      - name: Verify tool config files exist
        run: |
          ERRORS=0
          for lang in node typescript svelte python go rust; do
            if [ ! -d "tools/$lang" ]; then
              echo "FAIL: tools/$lang/ directory missing"
              ERRORS=1
            else
              echo "PASS: tools/$lang/ exists"
            fi
          done

          # Check key files
          for f in tools/node/package.json tools/typescript/tsconfig.json tools/python/pyproject.toml tools/go/.golangci.yml tools/rust/rustfmt.toml tools/svelte/svelte.config.js; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f missing"
              ERRORS=1
            else
              echo "PASS: $f exists"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            exit 1
          else
            echo "✅ All tool configs present"
          fi

  check-commands:
    name: Validate Slash Commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check slash commands are non-empty
        run: |
          ERRORS=0
          for cmd in .claude/commands/*.md; do
            if [ ! -s "$cmd" ]; then
              echo "FAIL: $cmd is empty"
              ERRORS=1
            else
              LINES=$(wc -l < "$cmd")
              echo "PASS: $cmd ($LINES lines)"
            fi
          done

          if [ $ERRORS -gt 0 ]; then
            exit 1
          else
            echo "✅ All slash commands validated"
          fi

  validate-agents:
    name: Validate Agent Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Check agent frontmatter and body
        run: |
          ERRORS=0
          VALID_MODELS="sonnet opus haiku inherit"
          VALID_COLORS="red blue green yellow purple orange"

          for agent in .claude/agents/*.md; do
            echo "--- Checking: $agent ---"
            AGENT_ERRORS=0

            # Frontmatter opens with ---
            head -1 "$agent" | grep -q "^---" || { echo "  FAIL: Missing frontmatter (first line must be ---)"; AGENT_ERRORS=1; }

            # Required frontmatter fields
            grep -q "^name:"        "$agent" || { echo "  FAIL: Missing name:";        AGENT_ERRORS=1; }
            grep -q "^description:" "$agent" || { echo "  FAIL: Missing description:"; AGENT_ERRORS=1; }
            grep -q "^tools:"       "$agent" || { echo "  FAIL: Missing tools:";       AGENT_ERRORS=1; }
            grep -q "^model:"       "$agent" || { echo "  FAIL: Missing model:";       AGENT_ERRORS=1; }

            # model value must be one of the allowed set
            MODEL=$(grep "^model:" "$agent" | head -1 | sed 's/model:[[:space:]]*//')
            if ! echo "$VALID_MODELS" | grep -qw "$MODEL"; then
              echo "  FAIL: model '$MODEL' is not valid (allowed: $VALID_MODELS)"
              AGENT_ERRORS=1
            fi

            # color value must be in allowed set (if present)
            if grep -q "^color:" "$agent"; then
              COLOR=$(grep "^color:" "$agent" | head -1 | sed 's/color:[[:space:]]*//')
              if ! echo "$VALID_COLORS" | grep -qw "$COLOR"; then
                echo "  FAIL: color '$COLOR' is not valid (allowed: $VALID_COLORS)"
                AGENT_ERRORS=1
              fi
            fi

            # System prompt body must be non-empty (content after closing ---)
            BODY=$(awk 'BEGIN{fm=0} /^---/{fm++; next} fm>=2{print}' "$agent" | tr -d '[:space:]')
            [ -z "$BODY" ] && { echo "  FAIL: System prompt body is empty"; AGENT_ERRORS=1; }

            if [ $AGENT_ERRORS -eq 0 ]; then
              echo "  PASS"
            else
              ERRORS=$((ERRORS + AGENT_ERRORS))
            fi
          done

          echo ""
          if [ $ERRORS -gt 0 ]; then
            echo "❌ $ERRORS format errors found in agents"
            exit 1
          else
            echo "✅ All agents passed format validation"
          fi

  check-badge-sync:
    name: Check README Badge Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify skills badge matches actual count
        run: |
          ACTUAL=$(find skills -name "skill.md" | wc -l | tr -d ' ')
          ERRORS=0

          # Check shield badge (line: skills-N-blueviolet)
          BADGE=$(grep -oE 'skills-[0-9]+-blueviolet' README.md | grep -oE '[0-9]+')

          # Check "What's in the box" table count (second-to-last |-delimited field on the Skills row)
          TABLE_COUNT=$(grep -F '| **Skills**' README.md | awk -F'|' '{print $(NF-1)}' | tr -d ' ')

          echo "Actual: $ACTUAL | Badge: $BADGE | Table: $TABLE_COUNT"

          if [ "$BADGE" != "$ACTUAL" ]; then
            echo "❌ Badge out of sync — change skills-${BADGE}-blueviolet → skills-${ACTUAL}-blueviolet"
            ERRORS=1
          fi

          if [ "$TABLE_COUNT" != "$ACTUAL" ]; then
            echo "❌ Table count out of sync — change Skills row count ${TABLE_COUNT} → ${ACTUAL}"
            ERRORS=1
          fi

          if [ $ERRORS -gt 0 ]; then
            exit 1
          else
            echo "✅ Badge and table both match actual skill count ($ACTUAL)"
          fi

  check-inventory-sync:
    name: Check Inventory Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify all skills are listed in README
        run: |
          ERRORS=0
          for skill_dir in skills/*/; do
            SKILL_NAME=$(basename "$skill_dir")
            if ! grep -q "\`${SKILL_NAME}\`" README.md; then
              echo "FAIL: skills/$SKILL_NAME is not listed in README.md"
              ERRORS=1
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "❌ Some skills are missing from README.md inventory"
            exit 1
          else
            echo "✅ All skills listed in README.md"
          fi

      - name: Verify all agents are listed in README
        run: |
          ERRORS=0
          for agent_file in .claude/agents/*.md; do
            AGENT_NAME=$(basename "$agent_file" .md)
            if ! grep -q "\`${AGENT_NAME}\`" README.md; then
              echo "FAIL: $AGENT_NAME is not listed in README.md"
              ERRORS=1
            fi
          done
          if [ $ERRORS -gt 0 ]; then
            echo "❌ Some agents are missing from README.md inventory"
            exit 1
          else
            echo "✅ All agents listed in README.md"
          fi

  check-links:
    name: Check Cross-References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify skill cross-references
        run: |
          WARNINGS=0
          # Find all skill references like "from X skill" or "X skill"
          for skill in skills/*/skill.md; do
            SKILL_NAME=$(basename $(dirname "$skill"))
            # Check if other skills reference this one
            REFS=$(grep -rl "$SKILL_NAME" skills/ --include="*.md" | grep -v "$skill" | wc -l)
            if [ "$REFS" -gt 0 ]; then
              echo "INFO: $SKILL_NAME is referenced by $REFS other skill(s)"
            fi
          done
          echo "✅ Cross-reference check complete"
